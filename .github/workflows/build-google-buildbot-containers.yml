name: Build Google Buildbot Containers

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-google-buildbot-containers.yml
      - 'buildbot/google/docker/**'
  pull_request:
    paths:
      - .github/workflows/build-google-buildbot-containers.yml
      - 'buildbot/google/docker/**'

jobs:
  build-containers:
    if: github.repository_owner == 'llvm'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        container-name:
          - profcheck
          - google-integrate
        container-target:
          - ''
        include:
          - container-name: mlgo
            container-target: rel
    steps:
      - name: Checkout LLVM Zorg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: buildbot/google/docker
      - name: Build Container
        uses: llvm/llvm-project/.github/actions/build-container@12e957fd7feb388b266fd71ab7960450df6884c1
        with:
          container-name: ${{ matrix.container-target && format('{0}-{1}', matrix.container-name, matrix.container-target) || matrix.container-name }}
          context: buildbot/google/docker/${{ matrix.container-name }}
          target: ${{ matrix.container-target }}
  
  push-containers:
    if: github.event_name == 'push'
    needs:
      - build-containers
    permissions:
      packages: write
    runs-on: ubuntu-26.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: llvm/llvm-project/.github/actions/push-container@12e957fd7feb388b266fd71ab7960450df6884c1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
